const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D")
  .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function buildDocs() {
  const docs = [];
  SCHOOLS.forEach(s => s.r.split("\n").forEach(line => {
    const [nganh, ma, diem, th] = line.split("|").map(x => x.trim());
    if (!nganh) return;
    docs.push({ id: slug(s.ten) + "__" + slug(nganh), data: {
      ten_truong: s.ten, tinh_thanh: s.tinh, loai_truong: s.loai,
      ten_nganh: nganh, ma_nganh: ma || "", to_hop: th || s.th, phuong_thuc: s.pt,
      diem_tk: diem || "", hoc_phi_tk: s.hp, website: s.web, nam_cap_nhat: "2026"
    }});
  }));
  return docs;
}

const logEl = document.getElementById("log");
const log = m => { logEl.textContent += m + "\n"; };
const docs = buildDocs();
document.getElementById("sum").textContent =
  "Sẵn sàng nạp " + SCHOOLS.length + " trường, " + docs.length + " dòng (trường × ngành).";

document.getElementById("go").addEventListener("click", async () => {
  const btn = document.getElementById("go");
  btn.disabled = true; logEl.textContent = "";
  try {
    if (document.getElementById("del").checked) {
      const names = ["Trường Đại học A", "Trường Đại học B", "Trường Đại học C"];
      const snap = await db.collection(COL.TRUONG).where("ten_truong", "in", names).get();
      const b = db.batch(); snap.forEach(d => b.delete(d.ref)); await b.commit();
      log("Đã xóa " + snap.size + " dòng trường mẫu.");
    }
    for (let i = 0; i < docs.length; i += 400) {
      const b = db.batch();
      docs.slice(i, i + 400).forEach(d => b.set(db.collection(COL.TRUONG).doc(d.id), d.data));
      await b.commit();
      log("Đã ghi " + Math.min(i + 400, docs.length) + "/" + docs.length);
    }
    log("Hoàn tất. Mở trang Tra cứu để kiểm tra.");
  } catch (e) {
    log("LỖI: " + e.message + "\nKiểm tra Firestore Rules: cần tạm cho phép ghi (allow write: if true) trong lúc nạp, nạp xong nhớ khóa lại.");
  }
  btn.disabled = false;
});
