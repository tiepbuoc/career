"điều dưỡng chuyên ngành gây mê hồi sức":"Điều dưỡng","điều dưỡng đa khoa":"Điều dưỡng","điều dưỡng nha khoa":"Điều dưỡng","điều dưỡng gây mê hồi sức":"Điều dưỡng","kỹ thuật gây mê hồi sức":"Điều dưỡng",
"công nghệ dược phẩm":"Hóa dược","khoa học y sinh":"Kỹ thuật y sinh",
"giáo dục tiểu học - sư phạm tiếng anh":"Giáo dục Tiểu học","sư phạm tin học và công nghệ tiểu học":"Sư phạm Tin học","hỗ trợ giáo dục người khuyết tật":"Giáo dục đặc biệt","công nghệ giáo dục":"Quản lý giáo dục","giáo dục pháp luật":"Giáo dục công dân","giáo dục quốc phòng - an ninh":"Giáo dục chính trị",
"tâm lý học giáo dục":"Tâm lý học","quản lý văn hóa":"Văn hóa học","hán nôm":"Văn học"
};

const _CANON_LOWER = {}; Object.keys(P).forEach(k => _CANON_LOWER[k.toLowerCase()] = k);
const baseName = s => s.replace(/\s*\([^)]*\)/g, "").replace(/\s*\(.*$/, "").replace(/,?\s*chuyên ngành.*$/i, "").replace(/\s+định hướng.*$/i, "")
  .replace(/^chất lượng cao\s+/i, "").replace(/\s+/g, " ").trim();
function canonNganh(name) {
  const b = baseName(name).toLowerCase();
  return _CANON_LOWER[b] || (ALIAS[b] && _CANON_LOWER[ALIAS[b].toLowerCase()]) || null;
}

const slug = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D")
  .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function buildDocs() {
  const docs = [];
  SCHOOLS.forEach(s => s.r.split("\n").forEach(line => {
    const [nganh, ma, diem, th] = line.split("|").map(x => x.trim());
    if (!nganh) return;
    docs.push({ id: slug(s.ten) + "__" + slug(nganh), data: {
      ten_truong: s.ten, tinh_thanh: s.tinh, loai_truong: s.loai,
      ten_nganh: canonNganh(nganh) || baseName(nganh), chuong_trinh: nganh, ma_nganh: ma || "", to_hop: th || s.th, phuong_thuc: s.pt,
      diem_tk: diem || "", hoc_phi_tk: s.hp, website: s.web, nam_cap_nhat: "2026"
    }});
  }));
  return docs;
}

// Tạo hồ sơ ngành chuẩn (collection "nganh") từ các dòng trường × ngành
function buildNganh(docs) {
  const g = {};
  docs.forEach(d => { (g[d.data.ten_nganh] = g[d.data.ten_nganh] || []).push(d.data); });
  return Object.keys(g).filter(k => P[k]).sort((a, b) => a.localeCompare(b, "vi")).map(k => {
    const rows = g[k], info = P[k], cnt = {};
    rows.forEach(r => (r.to_hop || "").split(/[,;]/).map(x => x.trim()).filter(Boolean).forEach(c => cnt[c] = (cnt[c] || 0) + 1));
    const th = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 6).join(", ");
    const ma = (rows.find(r => r.ma_nganh) || {}).ma_nganh || "";
    return { id: slug(k), data: { ma_nganh: ma, ten_nganh: k, nhom_nganh: info[0], mo_ta: info[1], nang_luc: info[2],
      so_thich: info[3], mon_hoc: info[4], vi_tri_viec_lam: info[5], to_hop: th || "A00, A01, D01" } };
  });
}

const logEl = document.getElementById("log");
const log = m => { logEl.textContent += m + "\n"; };
const docs = buildDocs();
const nganhDocs = buildNganh(docs);
document.getElementById("sum").textContent =
  "Sẵn sàng nạp " + SCHOOLS.length + " trường, " + docs.length + " dòng (trường × ngành) và " + nganhDocs.length + " ngành chuẩn (hồ sơ ngành).";

document.getElementById("go").addEventListener("click", async () => {
  const btn = document.getElementById("go");
  btn.disabled = true; logEl.textContent = "";
  try {
    if (document.getElementById("del").checked) {
      const names = ["Trường Đại học A", "Trường Đại học B", "Trường Đại học C"];
      const snap = await db.collection(COL.TRUONG).where("ten_truong", "in", names).get();
      const b = db.batch(); snap.forEach(d => b.delete(d.ref)); await b.commit();
      log("Đã xóa " + snap.size + " dòng trường mẫu.");
    }
    if (document.getElementById("del").checked) {
      const ours = new Set(nganhDocs.map(d => d.id));
      const s2 = await db.collection(COL.NGANH).where("ten_nganh", "in", ["Công nghệ thông tin", "Quản trị kinh doanh", "Sư phạm Toán học", "Y khoa"]).get();
      const b2 = db.batch(); let n2 = 0;
      s2.forEach(d => { if (!ours.has(d.id)) { b2.delete(d.ref); n2++; } });
      await b2.commit(); log("Đã xóa " + n2 + " ngành mẫu cũ.");
    }
    {
      const b = db.batch();
      nganhDocs.forEach(d => b.set(db.collection(COL.NGANH).doc(d.id), d.data));
      await b.commit();
      log("Đã ghi " + nganhDocs.length + " ngành chuẩn vào bảng nganh.");
    }
    for (let i = 0; i < docs.length; i += 400) {
      const b = db.batch();
      docs.slice(i, i + 400).forEach(d => b.set(db.collection(COL.TRUONG).doc(d.id), d.data));
      await b.commit();
      log("Đã ghi " + Math.min(i + 400, docs.length) + "/" + docs.length);
    }
    log("Hoàn tất. Mở trang Tra cứu để kiểm tra.");
  } catch (e) {
    log("LỖI: " + e.message + "\nKiểm tra Firestore Rules: cần tạm cho phép ghi (allow write: if true) trong lúc nạp, nạp xong nhớ khóa lại.");
  }
  btn.disabled = false;
});
async function wipeCollection(name) {
  let total = 0;
  while (true) {
    const snap = await db.collection(name).limit(400).get();
    if (snap.empty) break;
    const b = db.batch(); snap.forEach(d => b.delete(d.ref)); await b.commit();
    total += snap.size;
    log("  " + name + ": đã xóa " + total);
  }
  return total;
}
document.getElementById("wipe").addEventListener("click", async () => {
  if (!confirm("Xóa TOÀN BỘ dữ liệu trong bảng ngành và bảng trường trên Firestore? Không hoàn tác được (bảng tổ hợp giữ nguyên).")) return;
  if (prompt('Gõ XOA để xác nhận') !== "XOA") { log("Đã hủy."); return; }
  const w = document.getElementById("wipe"), g = document.getElementById("go");
  w.disabled = true; g.disabled = true; logEl.textContent = "";
  try {
    const a = await wipeCollection(COL.NGANH);
    const t = await wipeCollection(COL.TRUONG);
    log("Hoàn tất: đã xóa " + a + " ngành và " + t + " dòng trường. Bấm \"Nạp lên Firestore\" để nạp lại dữ liệu mới.");
  } catch (e) {
    log("LỖI: " + e.message + "\nCần tạm cho phép xóa/ghi trong Firestore Rules (allow write: if true).");
  }
  w.disabled = false; g.disabled = false;
});
</script>
